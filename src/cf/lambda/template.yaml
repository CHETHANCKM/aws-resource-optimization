AWSTemplateFormatVersion: "2010-09-09"
Description: Test Lambda functions with different sizing profiles for AWSRO report testing.

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Over-provisioned memory, trivial work -> expected over-provisioned
  OverProvisioned:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: awsro-test-overprovisioned-dev
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 3008
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      Tags:
        - { Key: Purpose, Value: awsro-test }
      Code:
        ZipFile: |
          def handler(event, context):
              return {"ok": True}

  # CPU-heavy work with small memory -> long durations
  UnderProvisioned:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: awsro-test-underprovisioned-dev
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      Tags:
        - { Key: Purpose, Value: awsro-test }
      Code:
        ZipFile: |
          def handler(event, context):
              total = 0
              for i in range(int(event.get("n", 5_000_000))):
                  total += i * i
              return {"total": total}

  # Fails on demand -> exercises the Errors metric
  Flaky:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: awsro-test-flaky-dev
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      Tags:
        - { Key: Purpose, Value: awsro-test }
      Code:
        ZipFile: |
          import random
          def handler(event, context):
              if random.random() < float(event.get("fail_rate", 0.3)):
                  raise RuntimeError("simulated failure")
              return {"ok": True}

  # Never invoked -> expected idle
  Unused:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: awsro-test-unused-dev
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 512
      Timeout: 10
      Role: !GetAtt FunctionRole.Arn
      Tags:
        - { Key: Purpose, Value: awsro-test }
      Code:
        ZipFile: |
          def handler(event, context):
              return {"ok": True}
