name: Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '\r\n' < VERSION)"
          BRANCH="${GITHUB_REF_NAME}"

          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version in VERSION: $BASE_VERSION"
            exit 1
          fi

          if [[ "$BRANCH" == "dev" ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="v${BASE_VERSION}-${SHORT_SHA}"
            RELEASE_NAME="${BASE_VERSION}-${SHORT_SHA}"
          else
            TAG="v${BASE_VERSION}"
            RELEASE_NAME="${BASE_VERSION}"
          fi

          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Release ${TAG} already exists. Update VERSION before pushing."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run tests
        run: pytest -q

      - name: Build Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build VSIX
        run: |
          cd vscode-extension
          npm ci
          npm run compile
          npx @vscode/vsce package

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ github.ref_name == 'dev' }}
          files: |
            dist/*
            vscode-extension/*.vsix

      - name: Keep only the three latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          old_tags="$(gh release list --limit 1000 --json tagName,createdAt,isDraft \
            --jq 'map(select(.isDraft == false)) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName')"

          if [[ -z "$old_tags" ]]; then
            echo "Three or fewer published releases exist; nothing to delete."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$old_tags"
