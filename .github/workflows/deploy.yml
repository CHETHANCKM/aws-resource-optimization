name: Deploy Test Stacks

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/cf/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which stack(s) to deploy'
        required: true
        default: all
        type: choice
        options: [all, ec2, lambda]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [ec2, lambda]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check target
        id: gate
        run: |
          target="${{ github.event.inputs.target || 'all' }}"
          if [ "$target" = "all" ] || [ "$target" = "${{ matrix.stack }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS via OIDC
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::437563065463:role/github-automation-policy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        if: steps.gate.outputs.run == 'true'
        run: |
          aws cloudformation deploy \
            --template-file src/cf/${{ matrix.stack }}/template.yaml \
            --stack-name awsro-test-${{ matrix.stack }}-dev \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Show outputs
        if: steps.gate.outputs.run == 'true'
        run: |
          aws cloudformation describe-stacks \
            --stack-name awsro-test-${{ matrix.stack }}-dev \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
